name: Deploy presentation

on:
  push:
    branches: [main]
    paths:
      - "apps/deck/**"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build presentation
        run: pnpm --filter @graph-agent/deck exec slidev build slides.md --base "/${{ github.event.repository.name }}/"

      - name: Add demo media
        shell: bash
        run: |
          cp docs/assets/graph-agent-demo-preview.png apps/deck/dist/graph-agent-demo-preview.png
          curl --fail --location --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/v0.1.0/Graph-Agent-Demo-Final-V4.mp4" \
            --output apps/deck/dist/Graph-Agent-Demo-Final-V4.mp4
          test -s apps/deck/dist/Graph-Agent-Demo-Final-V4.mp4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/deck/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
